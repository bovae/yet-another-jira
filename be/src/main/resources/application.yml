spring:
  application:
    name: yet-another-jira-backend

  datasource:
    url: ${YAJ_DATASOURCE_URL}
    username: ${YAJ_DATASOURCE_USERNAME}
    password: ${YAJ_DATASOURCE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  # Disable static resource mappings so unknown routes raise NoHandlerFoundException.
  web:
    resources:
      add-mappings: false

  # RFC 9457 problem details: framework exceptions become ProblemDetail bodies via
  # GlobalProblemHandler instead of falling through to BasicErrorController.
  mvc:
    problemdetails:
      enabled: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

yaj:
  valkey:
    host: ${YAJ_VALKEY_HOST}
    port: ${YAJ_VALKEY_PORT}
  cors:
    allowed-origins: ${YAJ_CORS_ALLOWED_ORIGINS}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"

logging:
  pattern:
    level: "%5p [%X{correlationId}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState
  info:
    env:
      enabled: true
