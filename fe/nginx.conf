# nginx server block for the SPA: serves the static Vite bundle, falls back to
# index.html for client-side routing, and reverse-proxies /api to the backend
# (so the SPA calls the API on its own origin — no browser CORS hop).

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # --- Security hardening headers (applied to every response) ---
    # CSP is intentionally omitted here: a correct policy is app-specific and is
    # best added once the SPA's asset/connect origins are finalized.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- API reverse proxy ---
    # The backend host is resolved lazily at request time via docker's embedded
    # DNS (127.0.0.11) + a variable in proxy_pass, so nginx still starts (and the
    # SPA stays reachable) even when the backend isn't resolvable yet — unlike a
    # static `upstream` block, which would refuse to start.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "http://be:8080";

        # Append the original request URI explicitly. A variable in proxy_pass
        # preserves the prefix either way, but naming $request_uri makes the
        # prefix-preserving (and query-string-preserving) behavior obvious.
        proxy_pass         $backend$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Do not buffer the whole response; stream it back to the client.
        proxy_buffering off;
    }

    # --- SPA history fallback ---
    # Try file, then dir, then index.html so deep links resolve to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
