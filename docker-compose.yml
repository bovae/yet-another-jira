services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yaj}
      POSTGRES_USER: ${POSTGRES_USER:-yaj}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yaj}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-yaj} -d ${POSTGRES_DB:-yaj}']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  valkey:
    image: valkey/valkey:8
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - backend

  be:
    build: ./be
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      # stringtype=unspecified lets PostgreSQL infer the bind-parameter type so String
      # comparisons against citext columns (users.email, teams.name) stay case-insensitive.
      YAJ_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-yaj}?stringtype=unspecified
      YAJ_DATASOURCE_USERNAME: ${POSTGRES_USER:-yaj}
      YAJ_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-yaj}
      YAJ_VALKEY_HOST: valkey
      YAJ_VALKEY_PORT: '6379'
      YAJ_CORS_ALLOWED_ORIGINS: ${YAJ_CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:5173}
      YAJ_SMTP_HOST: mailpit
      YAJ_SMTP_PORT: '1025'
      YAJ_SMTP_FROM: ${YAJ_SMTP_FROM:-no-reply@yet-another-jira.local}
      YAJ_SMTP_USERNAME: ''
      YAJ_SMTP_PASSWORD: ''
      YAJ_VERIFICATION_LINK_BASE_URL: ${YAJ_VERIFICATION_LINK_BASE_URL:-http://localhost:8081/verify}
      YAJ_VERIFICATION_REDIRECT_URL: ${YAJ_VERIFICATION_REDIRECT_URL:-http://localhost:8081/login}
      YAJ_VERIFICATION_ERROR_REDIRECT_URL: ${YAJ_VERIFICATION_ERROR_REDIRECT_URL:-http://localhost:8081/verify-error}
      YAJ_JWT_SECRET: ${YAJ_JWT_SECRET:-change-me-in-production-this-is-only-for-local-dev}
    ports:
      - '8080:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 9
      start_period: 30s
    networks:
      - backend
      - frontend

  fe:
    build: ./fe
    depends_on:
      be:
        condition: service_healthy
    ports:
      - '8081:80'
    networks:
      - frontend

  # Dev/test SMTP sink — opt-in. Start with: docker compose --profile mail up
  mailpit:
    image: axllent/mailpit:latest
    profiles: ['mail']
    ports:
      - '8025:8025'
      - '1025:1025'
    networks:
      - backend

volumes:
  pgdata:

networks:
  frontend:
  backend:
